name: astrbot_plugin_qq_identity
display_name: 身份识别与按人隔离
short_desc: 按 QQ 判定开发者/熟人/陌生人，注入可编辑身份块并按人隔离群内会话
desc: |-
  每轮把「当前发言人是谁、这个人有什么权限」写进系统提示词尾部（临时块，不占对话历史），并按发言人在群内拆开会话，避免「一群人共用一个脑子」。

  - **三档身份**：开发者（只看 QQ 名单，留空自动用 AstrBot 的 `admins_id`）/ 熟人（`people.json` 登记表）/ 陌生人。
  - **三套可编辑模板**：每档一套文案 + 11 个变量；WebUI 里分档切换编辑、变量实时高亮、保存前校验，改坏了可单档「恢复默认」。
  - **默认不泄漏开发者 QQ**：陌生人模板不含 `{masters}`，想写就显式写，页面会给出风险警告。
  - **按人隔离**：把群消息的 `session_id` 改成 `{发送者}_{群号}`，可配生效群与名单，比内置 `unique_session` 的全有或全无更细。
  - **昵称打码**：非开发者昵称里的「开发者」等词在数据层就地替换，覆盖内置 identifier 与群聊上下文历史。
  - **熟人体系**：`/know` 命令 + 页面增删改 + 熟人候选观察名单（只记录、不给任何权限）+ 开发者专属 LLM 工具（只在本轮挂载，内部二次校验，永远写不出开发者）。
  - **健康模式瘦身**：开发者发言时删掉 AstrBot 的 Safe Mode 长块，其他人换成一句中文底线，省约 400 字符。
  - **只读预演**：填一个 QQ 就能看到模型这一轮实际读到的身份块。

  WebUI 页面：开关、开发者名单、昵称打码、三套模板、熟人登记、熟人候选、隔离设置、预演，全在一页。
version: 0.8.5
author: Ushio155
repo: https://github.com/Ushio155/astrbot_plugin_qq_identity
astrbot_version: ">=4.26.0"
support_platforms:
  - aiocqhttp
tags:
  - 身份
  - 权限
  - 提示词注入
  - 群聊
help: 装好后打开 WebUI → 插件 → 身份识别：开关、开发者名单、昵称打码、三套身份块模板、熟人登记、熟人候选、隔离与预演都在这一页。指令：/know QQ 称呼 [关系] [备注]、/know list、/know del QQ（仅开发者）；/我是谁 查自己；/ident 诊断。
